<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扩扩帮</title>
    <!-- 站酷快乐体（Google Fonts 国内镜像） -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">


    <style>
        .container{
            width: 752px;
            height: 670px;
            background: url(img/kwx941.png) no-repeat center center;
        }
        .header {
            display: flex;
            align-items: center;
            padding-left: 20px;
            padding-top: 20px;

        }
        .header img {
            width: 30px;
            height: 30px;
        }

        .header p {
            font-size: 24px;
            color: #fff;
            margin: 0;
            margin-left: 8px;
        }

        /* 主标题 */
        .slogan {
            font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 56px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            letter-spacing: 4px;
            text-shadow: 3px 3px 0 #2d55b8;
            margin: 40px 0 24px;
        }

        /* 副标题：两端渐隐的渐变背景条 */
        .sub-slogan {
            width: 420px;
            margin: 0 auto;
            padding: 8px 0;
            text-align: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Source Han Sans CN", sans-serif;
            font-size: 20px;
            color: #fff;
            letter-spacing: 2px;
            background: linear-gradient(90deg,
                rgba(45,85,184,0) 0%,
                rgba(45,85,184,0.55) 30%,
                rgba(45,85,184,0.55) 70%,
                rgba(45,85,184,0) 100%);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="img/kwx942.png">
        <p>括括帮</p>
    </div>

    <h1 class="slogan">有问题，找朋友 ！</h1>
    <p class="sub-slogan">真朋友，更愿意一起解决问题</p>

</div>
    </body>
</html>
