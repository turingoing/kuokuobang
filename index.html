<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扩扩帮</title>
    <!-- 站酷快乐体（Google Fonts 国内镜像） -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">


    <style>
        /* rem 适配：1rem = 10px（设计稿 752px 宽）。
           屏幕宽于 752px 时保持原样，窄于 752px 时整体等比缩小，布局不变 */
        html { font-size: min(calc(100vw / 75.2), 10px); }
        body { margin: 0; background: linear-gradient(180deg, #6f9bf7 0%, #5b8df5 100%); }

        .container{
            width: 75.2rem;
            height: 67rem;
            margin: 0 auto;
            background: url(img/kwx941.png) no-repeat center center;
            background-size: 100% 100%;
        }
        .header {
            display: flex;
            align-items: center;
            padding-left: 2.4rem;
            padding-top: 2.4rem;

        }
        .header img {
            width: 4rem;
            height: 4rem;
        }

        .header p {
            font-size: 2.8rem;
            color: #fff;
            margin: 0;
            margin-left: 0.8rem;
        }

        /* 主标题 */
        .slogan {
            font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 7rem;
            font-weight: 300;
            color: #fff;
            text-align: center;
            letter-spacing: 0.4rem;
            text-shadow: 0.3rem 0.3rem 0 #2d55b8;
            margin: 4rem 0 2.4rem 5rem;
        }

        /* 副标题：两端渐隐的渐变背景条 */
        .sub-slogan {
            width: 60rem;
            margin: 0 auto;
            padding: 0.8rem 0;
            font-weight: bold;
            text-align: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Source Han Sans CN", sans-serif;
            font-size: 3rem;
            color: #fff;
            letter-spacing: 0.2rem;
            background: linear-gradient(90deg,
                rgba(45,85,184,0) 0%,
                rgba(45,85,184,0.55) 30%,
                rgba(45,85,184,0.55) 70%,
                rgba(45,85,184,0) 100%);
        }

        /* 能力图浅色卡片 */
        .profile-card {
            width: 64rem;
            height: 40rem;
            box-sizing: border-box;
            margin: 6rem 5rem;
            padding: 3rem 3.6rem;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 2.4rem;
        }
        .card-header {
            display: flex;
            align-items: center;
        }
        .avatar {
            width: 8rem;
            height: 8rem;
            border-radius: 50%;
            background: #fff;
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }
        .card-header .username {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 3.4rem;
            font-weight: bold;
            color: #333;
            margin-left: 1.6rem;
            white-space: nowrap;
        }
        .change-avatar {
            display: flex;
            align-items: center;
            margin-left: auto;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 2.6rem;
            font-weight: bold;
            color: #2d3a8c;
            cursor: pointer;
        }
        .change-avatar img {
            width: 1.4rem;
            height: 1.4rem;
            margin-left: 0.6rem;
        }

        /* 数据统计：数字 + 底座 + 文字 */
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 2.4rem;
        }
        .stat {
            display: flex;
            margin-top: 2.4rem;
            flex-direction: column;
            align-items: center;
            width: 18rem;
        }
        .stat .num {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 5rem;
            font-weight: bold;
            color: #2d3a8c;
            line-height: 1;
            position: relative;
            z-index: 1;
            margin-bottom: -4.5rem;
        }
        .stat .podium {
            width: 15rem;
            height: auto;
            display: block;
        }
        .stat .label {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 2.6rem;
            color: #2d3a8c;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="img/kwx942.png">
        <p>括括帮</p>
    </div>

    <h1 class="slogan">有问题，找朋友 ！</h1>
    <p class="sub-slogan">真朋友，更愿意一起解决问题</p>

    <div class="profile-card">
        <div class="card-header">
            <div class="avatar"><img id="avatar" alt="头像"></div>
            <span class="username"><span id="nickname">李雷</span> 的能力图</span>
            <div class="change-avatar" id="change-avatar">更换头像<img src="img/kwx411.png"></div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="num">10</div>
                <img class="podium" src="img/kwx940.png">
                <div class="label">可求助好友</div>
            </div>
            <div class="stat">
                <div class="num">10</div>
                <img class="podium" src="img/kwx940.png">
                <div class="label">可提供帮助</div>
            </div>
            <div class="stat">
                <div class="num">0</div>
                <img class="podium" src="img/kwx940.png">
                <div class="label">获得点赞</div>
            </div>
        </div>
    </div>

</div>
<script src="main.js"></script>
    </body>
</html>
