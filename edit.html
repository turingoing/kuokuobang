<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑资料</title>
    <link href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #6f9bf7 0%, #5b8df5 100%);
        }
        .edit-panel {
            max-width: 640px;
            width: 90%;
            margin: 60px auto;
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }
        .edit-panel h2 {
            font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #2d55b8;
            margin: 0 0 24px;
        }
        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
            border: 3px solid #dfe8ff;
            cursor: pointer;
        }
        .tip {
            color: #888;
            font-size: 14px;
            margin: 10px 0 24px;
        }
        .field {
            text-align: left;
            margin-bottom: 24px;
        }
        .field label {
            display: block;
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
        }
        .field input {
            width: 100%;
            height: 44px;
            border: 1px solid #ccd6f6;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 16px;
            outline: none;
        }
        .field input:focus {
            border-color: #5b8df5;
        }
        .save-btn {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 23px;
            background: #5b8df5;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .save-btn:active {
            background: #4a7df0;
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #888;
            font-size: 14px;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="edit-panel">
    <h2>编辑资料</h2>

    <!-- 点击头像从手机本地上传 -->
    <img id="avatar-preview" class="avatar-preview" src="img/kwx942.png" alt="头像">
    <p class="tip">点击头像从相册选择图片</p>
    <input type="file" id="avatar-input" accept="image/*" hidden>

    <div class="field">
        <label for="nickname-input">昵称</label>
        <input type="text" id="nickname-input" placeholder="请输入昵称" maxlength="12">
    </div>

    <button id="save-btn" class="save-btn">保存并返回主页</button>
    <a id="back-home" class="back-link" href="index.html">返回主页（不保存）</a>
</div>
<script src="main.js"></script>
</body>
</html>
